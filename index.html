<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Invitation | Neha & Shubham</title>

<!-- Meta info -->
<meta name="description" content="With the divine grace of the almighty, inviting you and your family to Neha & Shubham Wedding to be held on 1st May 2026 at Shree Swami Samarth Hall,Alandi Pune Pune from 6:30 PM onwards.">
<meta name="author" content="Mayank Chourasia">

<!-- Open Graph for WhatsApp / Social Sharing -->
<meta property="og:title" content="Wedding Invitation | Neha & Shubham" />
<meta property="og:description" content="With the divine grace of the almighty, we invite you to Neha & Shubham's wedding on 1st May 2026 at Shree Swami Samarth Hall,Alandi Pune from 6:30 PM onwards." />
<meta property="og:image" content="./assets/img/Ganpati.jpg" />
<meta property="og:url" content="https://yourdomain.com/" />
<meta property="og:type" content="website" />

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Arvo&display=swap" rel="stylesheet">

<style>
/* RESET */
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Arvo', serif;
  background: linear-gradient(135deg, #fff0f3, #ffe5ec);
  overflow-x: hidden;
}

/* LOADER */
#loader {
  position: fixed;
  width: 100%;
  height: 100%;
  background: #fff0f3;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 15px;
  z-index: 9999;
  animation: fadeOut 2s ease 3s forwards;
  opacity: 1;
}

/* Ganpati Image */
#loader img {
  width: 100px;
  height: 100px;
  animation: floatGanpati 3s ease-in-out infinite alternate, glowGanpati 2s ease-in-out infinite alternate;
  filter: drop-shadow(0 0 10px #ff4d6d);
}

/* Ganesh Text above image */
.ganesh-text {
  font-family: 'Dancing Script', cursive;
  font-size: 30px;
  color: #c9184a;
  animation: glow 2s infinite alternate;
}

#loader h1 {
  font-family: 'Dancing Script', cursive;
  font-size: 40px;
  color: #e63946;
  animation: fadeInText 2s ease forwards;
}

/* Animations */
@keyframes fadeOut { to { opacity:0; visibility:hidden; } }
@keyframes fadeInText { from {opacity:0;} to{opacity:1;} }
@keyframes floatGanpati {
  0% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(-10px) rotate(5deg); }
  100% { transform: translateY(0px) rotate(0deg); }
}
@keyframes glowGanpati {
  from { filter: drop-shadow(0 0 5px #ff4d6d); }
  to { filter: drop-shadow(0 0 20px #ff1a4d); }
}
@keyframes glow { from { text-shadow: 0 0 5px #ffccd5; } to { text-shadow: 0 0 20px #ff4d6d; } }

/* HERO */
.hero {
  height: 100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  color:#e63946;
  animation: fadeInContent 2s ease 3s forwards;
  opacity: 0;
}
@keyframes fadeInContent { from {opacity:0;} to{opacity:1;} }

.hero h1 { 
  font-family:'Dancing Script', cursive; 
  font-size:60px; 
  animation: typing 4s steps(20) 1 forwards;
  overflow: hidden;
  white-space: nowrap;
  border-right: 4px solid #e63946;
}
@keyframes typing { from { width: 0; } to { width: 22ch; } }
.hero p { font-size:20px; margin-top:5px; }

/* CARD */
.glass-card {
  margin:20px auto;
  padding:30px;
  border-radius:20px;
  background:rgba(255,255,255,0.7);
  backdrop-filter: blur(15px);
  text-align:center;
  max-width:500px;
  box-shadow: 0 0 20px rgba(230,57,70,0.4);
}

/* COUNTDOWN */
#countdown {
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:20px;
}
#countdown div {
  background: linear-gradient(135deg, #ff4d6d, #ff99ac);
  padding:15px 20px;
  border-radius:15px;
  color:white;
  box-shadow: 0 0 10px rgba(0,0,0,0.2);
}
#countdown span { font-size:25px; font-weight:bold; }

/* BUTTON */
.venue-btn {
  margin-top:20px;
  background:#e63946;
  color:white;
  padding:12px 25px;
  border:none;
  border-radius:25px;
  cursor:pointer;
  transition: all 0.3s ease;
}
.venue-btn:hover { background:#ff1a4d; transform: scale(1.05); }

/* MUSIC */
.music-btn {
  position:fixed;
  bottom:20px;
  right:20px;
  background:#e63946;
  color:white;
  padding:12px;
  border-radius:50%;
  cursor:pointer;
  box-shadow:0 0 10px #ff4d6d;
}

/* HEARTS */
.heart {
  position:fixed;
  bottom:-10px;
  color:#ff4d6d;
  font-size:20px;
  animation:float 6s linear infinite;
}
@keyframes float {
  from { transform:translateY(0) rotate(0deg); opacity:1; }
  to { transform:translateY(-100vh) rotate(360deg); opacity:0; }
}

/* FOOTER DESIGNER */
.footer-designer {
  text-align:center;
  margin:20px;
  font-family: 'Arvo', serif;
  font-size:14px;
  color:#e63946;
}

.footer-designer a {
  color:#e63946;
  text-decoration:none;
  font-weight:bold;
}
.footer-designer a:hover { text-decoration:underline; }

</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
  <div class="ganesh-text">।। श्री गणेशाय नमः ।।</div>
  <img src="./assets/img/ganpati.png" alt="Ganpati">
  <h1>Neha ❤️ Shubham</h1>
</div>

<!-- HERO -->
<section class="hero">
  <h1>Neha ❤️ Shubham</h1>
  <p>Are Getting Married</p>
  <p>1st May 2026</p>
  <p style="margin-top:10px; font-weight:bold; color:#c9184a;">
    शुभ मुहूर्त: 6:30 PM onwards
  </p>
</section>

<!-- MAIN CARD -->
<div class="glass-card">
<h2>You're Invited 💌</h2>

<!-- COUNTDOWN -->
<div id="countdown">
  <div><span id="days"></span><p>Days</p></div>
  <div><span id="hours"></span><p>Hours</p></div>
  <div><span id="minutes"></span><p>Minutes</p></div>
  <div><span id="seconds"></span><p>Seconds</p></div>
</div>

<!-- VENUE -->
<p>📍 Shree Swami Samarth Hall,Alandi Pune </p>
<a href="https://maps.app.goo.gl/Rq9KoJcUi5mHVD4Y7" target="_blank">
  <button class="venue-btn">View Venue</button>
</a>
</div>

<!-- MUSIC -->
<div class="music-btn" onclick="toggleMusic()">🎵</div>
<audio id="audio" src="./assets/mp3/song.mp3"></audio>

<!-- DESIGNER FOOTER -->
<div class="footer-designer">
Designed by <a class="home" href="https://www.linkedin.com/in/mayank-chourasia/" target="_blank">@MayankChourasia</a>
</div>

<script>

/* MUSIC */
function toggleMusic(){
  const audio = document.getElementById("audio");
  audio.paused ? audio.play() : audio.pause();
}

/* COUNTDOWN */
const weddingDate = new Date("May 1, 2026 18:30:00").getTime();

setInterval(()=>{
  const now = new Date().getTime();
  const gap = weddingDate - now;

  if(gap < 0){
    document.getElementById("countdown").innerHTML = "🎉 Wedding Started!";
    return;
  }

  document.getElementById("days").innerText = Math.floor(gap/(1000*60*60*24));
  document.getElementById("hours").innerText = Math.floor((gap/(1000*60*60))%24);
  document.getElementById("minutes").innerText = Math.floor((gap/(1000*60))%60);
  document.getElementById("seconds").innerText = Math.floor((gap/1000)%60);
},1000);

/* HEARTS */
setInterval(()=>{
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "❤️";
  heart.style.left = Math.random()*100+"vw";
  heart.style.fontSize = (Math.random()*20+10)+"px";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),6000);
},500);

</script>

</body>
</html>
