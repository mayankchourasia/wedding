<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Invitation | Neha & Shubham</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Arvo&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

/* 🌸 BACKGROUND IMAGE ADDED */
body {
  font-family: 'Arvo', serif;
  background: linear-gradient(rgba(255,240,243,0.75), rgba(255,229,236,0.75)),
              url('./assets/img/Background.jpg') no-repeat center center/cover;
  overflow-x: hidden;
}

/* LOADER */
#loader {
  position: fixed;
  width: 100%;
  height: 100%;
  background: #fff0f3;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 15px;
  z-index: 9999;
  animation: fadeOut 2s ease 3s forwards;
}

#loader img {
  width: 100px;
  animation: float 3s infinite alternate;
}

@keyframes fadeOut { to { opacity:0; visibility:hidden; } }
@keyframes float {
  from { transform: translateY(0px); }
  to { transform: translateY(-10px); }
}

/* HERO */
.hero {
  height: 100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  color:#e63946;
  backdrop-filter: blur(3px);
  animation: fadeInContent 2s ease 3s forwards;
  opacity: 0;
}

@keyframes fadeInContent { to{opacity:1;} }

.hero h1 { 
  font-family:'Dancing Script', cursive; 
  font-size:60px; 
}

.hero p { font-size:20px; }

/* GLASS CARD */
.glass-card {
  margin:20px auto;
  padding:30px;
  border-radius:20px;
  background:rgba(255,255,255,0.85);
  backdrop-filter: blur(15px);
  text-align:center;
  max-width:500px;
  box-shadow: 0 0 20px rgba(230,57,70,0.4);
}

/* COUNTDOWN */
#countdown {
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:20px;
}
#countdown div {
  background: linear-gradient(135deg, #ff4d6d, #ff99ac);
  padding:15px;
  border-radius:15px;
  color:white;
}
#countdown span {
  font-size:22px;
  font-weight:bold;
}

/* BUTTON */
.venue-btn {
  margin-top:20px;
  background:#e63946;
  color:white;
  padding:12px 25px;
  border:none;
  border-radius:25px;
  cursor:pointer;
}
.venue-btn:hover { background:#ff1a4d; }

/* HEART ANIMATION */
.heart {
  position:fixed;
  bottom:-10px;
  color:#ff4d6d;
  animation: floatUp 6s linear infinite;
}
@keyframes floatUp {
  to {
    transform:translateY(-100vh);
    opacity:0;
  }
}

/* GIF SECTION */
.gif-section {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:15px;
  margin:30px;
}
.gif-section img {
  width:200px;
  border-radius:15px;
}

/* MUSIC BUTTON */
.music-btn {
  position:fixed;
  bottom:20px;
  right:20px;
  background:#e63946;
  color:white;
  padding:12px;
  border-radius:50%;
  cursor:pointer;
}

.footer {
  text-align:center;
  margin:20px;
  color:#e63946;
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
  <h2>।। श्री गणेशाय नमः ।।</h2>
  <img src="./assets/img/Ganpati.jpg">
  <h1>Neha ❤️ Shubham</h1>
</div>

<!-- HERO -->
<section class="hero">
  <h1>Neha ❤️ Shubham</h1>
  <p>Are Getting Married</p>
  <p>1st May 2026</p>
  <p>शुभ मुहूर्त: 7:20 PM</p>
</section>

<!-- MESSAGE -->
<div style="text-align:center; font-size:22px; color:#c9184a;">
  🙏 Please come and give your blessings 🙏
</div>

<!-- CARD -->
<div class="glass-card">
  <h2>You're Invited 💌</h2>

  <div id="countdown">
    <div><span id="days"></span><p>Days</p></div>
    <div><span id="hours"></span><p>Hours</p></div>
    <div><span id="minutes"></span><p>Minutes</p></div>
    <div><span id="seconds"></span><p>Seconds</p></div>
  </div>

  <p>📍 Shree Swami Samarth Hall, Alandi Pune</p>

  <a href="https://maps.app.goo.gl/B8oUsdgwx2kQxHFXA" target="_blank">
    <button class="venue-btn">View Venue</button>
  </a>
</div>

<!-- GIFS -->
<section class="gif-section">
  <img src="./assets/img/jkl.gif">
  <img src="./assets/img/cvb.gif">
  <img src="./assets/img/bvc.gif">
  <img src="./assets/img/ggg.gif">
</section>

<!-- MUSIC -->
<div class="music-btn" onclick="toggleMusic()">🎵</div>
<audio id="audio" src="./assets/mp3/song.mp3"></audio>

<!-- FOOTER -->
<div class="footer">
  Designed by @MayankChourasia
</div>

<script>
function toggleMusic(){
  const audio = document.getElementById("audio");
  audio.paused ? audio.play() : audio.pause();
}

const weddingDate = new Date("May 1, 2026 19:20:00").getTime();

setInterval(()=>{
  const now = new Date().getTime();
  const gap = weddingDate - now;

  if(gap < 0){
    document.getElementById("countdown").innerHTML = "🎉 Wedding Started!";
    return;
  }

  document.getElementById("days").innerText = Math.floor(gap/(1000*60*60*24));
  document.getElementById("hours").innerText = Math.floor((gap/(1000*60*60))%24);
  document.getElementById("minutes").innerText = Math.floor((gap/(1000*60))%60);
  document.getElementById("seconds").innerText = Math.floor((gap/1000)%60);
},1000);

/* Floating Hearts */
setInterval(()=>{
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "❤️";
  heart.style.left = Math.random()*100+"vw";
  heart.style.fontSize = (Math.random()*20+10)+"px";
  document.body.appendChild(heart);

  setTimeout(()=>heart.remove(),6000);
},500);
</script>

</body>
</html>
